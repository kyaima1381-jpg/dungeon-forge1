</style></head><body><div id="app"><header class="top"><div><div class="logo">DUNGEON FORGE</div><div class="sub">ABYSS OF THE FALLEN</div></div><div class="floor" id="floorLabel">拠点 / CAMP</div></header><div id="error"></div><div class="hud"><div class="stat">HP<div class="bar"><div id="hpbar" class="fill"></div></div><span class="nums" id="hpnum"></span></div><div class="stat food">満腹<div class="bar"><div id="foodbar" class="fill"></div></div><span class="nums" id="foodnum"></span></div></div><div class="equip-strip" id="equipStrip">⚔ 未装備　🛡 未装備　💍 未装備</div><div class="board"><canvas id="game" width="480" height="480"></canvas><div class="toast" id="toast"></div><div class="floater" id="overlay"><div class="modal"><div class="emblem" id="emblem">⚔️</div><h1 id="modalTitle">DUNGEON<br>FORGE</h1><div class="tag" id="modalTag">ABYSS OF THE FALLEN</div><p class="desc" id="modalDesc">死が装備を奪い、探索が富をもたらす。<br>拾え。鍛えろ。深淵へ潜れ。<br><span class="gold">バッグと所持金は死亡後も引き継ぐ。</span></p><button class="btn" id="mainButton" style="width:100%">⚔ ダンジョンへ潜る</button><button class="btn secondary" id="closeButton" style="width:100%;margin-top:10px;display:none">拠点へ戻る</button></div></div></div><div class="actions"><button class="btn secondary" id="returnBtn">↩ 帰還</button><button class="btn secondary" id="potionBtn">🧪 回復 ×2</button><button class="btn secondary" id="mapBtn">◈ MAP</button></div><div class="log" id="log">深淵の入口。最初の探索に備えよう。</div><div class="controls"><div class="dpad"><span></span><button class="pad" data-dir="0,-1">▲</button><span></span><button class="pad" data-dir="-1,0">◀</button><button class="pad" id="waitBtn">◆</button><button class="pad" data-dir="1,0">▶</button><span></span><button class="pad" data-dir="0,1">▼</button><span></span></div><div class="utility"><button class="round" id="attackBtn">⚔<small>攻撃</small></button><span class="muted" id="stats">ATK 5 · DEF 1</span><span class="gold" id="gold">✦ 0 G</span></div></div><div class="tabs"><button class="tab sel" data-tab="bag">🎒 バッグ</button><button class="tab" data-tab="gear">🛡 装備</button><button class="tab" data-tab="forge">⚒ 鍛冶</button><button class="tab" data-tab="shop">💰 売却</button></div><section class="panel" id="panel"></section><button class="panel-close" id="panelClose" aria-label="閉じる">× 閉じる</button><div class="foot">AUTOSAVE · iPhone Safari対応 · オフライン動作</div></div><script>
'use strict';
(function(){
const $=id=>document.getElementById(id),C=$('game'),ctx=C.getContext('2d');ctx.imageSmoothingEnabled=false;
const N=25,S=20,V=24;let seed=0,phase='camp',floor=1,hp=36,maxhp=36,food=100,gold=0,potions=2,kills=0,turn=0,bag=[],gear={weapon:null,armor:null,ring:null},map=[],seen=[],enemies=[],loot=[],stairs={x:0,y:0},p={x:0,y:0},tab='bag',selected=null,uid=1,showFullMap=false,fx=[],shake=0,runId=0;
const types={weapon:['錆びた短剣','鉄の剣','蒼雷の刃','深淵の大剣'],armor:['旅人の外套','鋼鉄の鎧','守護者の甲冑','不滅の鎧'],ring:['銅の指輪','狩人の指輪','魔導の指輪','王者の指輪']};
const rarity=['common','rare','epic','legend'],rcolors=['#bec0c5','#58b6fa','#ca85ff','#ffc66b'];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choice=a=>a[rand(0,a.length-1)],dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),tile=(x,y)=>map[y]?.[x];
function makeItem(type,lev=floor){let r=Math.min(3,Math.floor(Math.random()*Math.random()*5+lev/7));return{id:uid++,type,r,power:rand(2,4)+r*3+Math.floor(lev/2),name:types[type][r],price:12+r*24+lev*7};}
function icon(i){return i.type==='weapon'?'⚔️':i.type==='armor'?'🛡️':'💍'}
function atk(){return 5+(gear.weapon?.power||0)+Math.floor((gear.ring?.power||0)/2)}function def(){return 1+(gear.armor?.power||0)+Math.floor((gear.ring?.power||0)/3)}
function log(s){$('log').textContent=s}function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),850)}
function save(){try{localStorage.setItem('dforge-abyss-v1',JSON.stringify({gold,potions,bag,gear,uid,kills}))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem('dforge-abyss-v1')||'null');if(d){gold=d.gold||0;potions=d.potions??2;bag=Array.isArray(d.bag)?d.bag:[];gear=d.gear||gear;uid=d.uid||1;kills=d.kills||0;}}catch(e){}}
function floorMap(){map=Array.from({length:N},()=>Array(N).fill(1));seen=Array.from({length:N},()=>Array(N).fill(false));enemies=[];loot=[];let rooms=[];
for(let k=0;k<90&&rooms.length<12;k++){let w=rand(3,7),h=rand(3,7),x=rand(1,N-w-2),y=rand(1,N-h-2);if(rooms.some(r=>x<=r.x+r.w&&x+w>=r.x-1&&y<=r.y+r.h&&y+h>=r.y-1))continue;for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)map[j][i]=0;let cx=x+Math.floor(w/2),cy=y+Math.floor(h/2);if(rooms.length){let last=rooms[rooms.length-1],xx=last.cx,yy=last.cy;if(Math.random()<.5){while(xx!==cx){map[yy][xx]=0;xx+=Math.sign(cx-xx)}while(yy!==cy){map[yy][xx]=0;yy+=Math.sign(cy-yy)}}else{while(yy!==cy){map[yy][xx]=0;yy+=Math.sign(cy-yy)}while(xx!==cx){map[yy][xx]=0;xx+=Math.sign(cx-xx)}}map[cy][cx]=0}rooms.push({x,y,w,h,cx,cy})}
if(rooms.length<2){for(let y=2;y<N-2;y++)for(let x=2;x<N-2;x++)map[y][x]=0;rooms=[{cx:3,cy:3},{cx:N-4,cy:N-4}]}
p={x:rooms[0].cx,y:rooms[0].cy};stairs={x:rooms[rooms.length-1].cx,y:rooms[rooms.length-1].cy};
let free=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(map[y][x]===0&&dist({x,y},p)>5&&dist({x,y},stairs)>1)free.push({x,y});free.sort(()=>Math.random()-.5);
for(let i=0;i<Math.min(6+floor*2,20)&&free.length;i++){let z=free.pop(),kind=Math.random()<.2?'brute':Math.random()<.3?'wisp':'slime';enemies.push({...z,kind,hp:kind==='brute'?14+floor*4:kind==='wisp'?7+floor*2:9+floor*2,max:14+floor*4,atk:kind==='brute'?6+floor:kind==='wisp'?4+floor:3+floor})}
for(let i=0;i<Math.min(9+floor,16)&&free.length;i++){let z=free.pop();loot.push({...z,kind:Math.random()<.38?'coin':Math.random()<.14?'potion':'gear'})}reveal();}
function reveal(){for(let y=p.y-4;y<=p.y+4;y++)for(let x=p.x-4;x<=p.x+4;x++)if(x>=0&&x<N&&y>=0&&y<N&&Math.hypot(x-p.x,y-p.y)<=4.7)seen[y][x]=true}
function start(){phase='run';floor=1;hp=maxhp;food=100;turn=0;runId++;floorMap();$('overlay').style.display='none';log('第1階層。出口の階段を探せ。');toast('第 1 階層');render()}
function end(reason,dead=false){phase='camp';if(dead){gear={weapon:null,armor:null,ring:null};hp=maxhp;food=100}save();$('overlay').style.display='flex';$('emblem').textContent=dead?'💀':'🏰';$('modalTitle').innerHTML=dead?'YOU DIED':'探索終了';$('modalTag').textContent=dead?'EQUIPMENT LOST':'RETURN TO CAMP';$('modalDesc').innerHTML=dead?'装備は失われた。<br><span class="gold">バッグと所持金は保持された。</span>':'戦利品を持って拠点に帰還した。<br>装備を強化して次の探索へ。';$('mainButton').textContent='⚔ 再び潜る';$('closeButton').style.display='block';log(reason);render()}
function descend(){floor++;hp=Math.min(maxhp,hp+6);food=Math.min(100,food+18);floorMap();toast('第 '+floor+' 階層');log('深淵へ降りた。少し体力と満腹度を回復。')}
function dropAt(x,y){if(Math.random()<.65)loot.push({x,y,kind:Math.random()<.25?'coin':'gear'})}
function hit(e){let dmg=Math.max(1,atk()+rand(-2,3)-(e.kind==='brute'?3:0));e.hp-=dmg;fx.push({x:e.x,y:e.y,n:dmg,t:18});shake=5;if(e.hp<=0){enemies=enemies.filter(z=>z!==e);kills++;gold+=e.kind==='brute'?16:6;dropAt(e.x,e.y);log('敵を撃破！ '+dmg+' ダメージ。戦利品を確認しよう。');if(e.kind==='brute')toast('ELITE SLAIN')}else log('攻撃命中！ '+dmg+' ダメージ');advance()}
function pickup(){let d=loot.find(z=>z.x===p.x&&z.y===p.y);if(!d)return;loot=loot.filter(z=>z!==d);if(d.kind==='coin'){let g=rand(9,26)+floor*3;gold+=g;log('金貨を '+g+' G 手に入れた。')}else if(d.kind==='potion'){potions++;log('回復薬を入手した。')}else{let it=makeItem(choice(['weapon','weapon','armor','ring']));bag.push(it);log(it.name+' を入手！');if(it.r>=2)toast(it.r===3?'LEGENDARY!':'EPIC DROP!')}save()}
function move(dx,dy){if(phase!=='run')return;let x=p.x+dx,y=p.y+dy;if(tile(x,y)!==0){log('石壁に行く手を阻まれた。');return}let e=enemies.find(z=>z.x===x&&z.y===y);if(e){hit(e);return}p.x=x;p.y=y;pickup();if(x===stairs.x&&y===stairs.y){descend();render();return}advance()}
function advance(){turn++;if(turn%2===0)food=Math.max(0,food-1);if(food===0&&turn%2===0){hp-=2;log('飢餓で体力が削られる！')}if(hp<=0){end('深淵で倒れた。',true);return}for(let e of enemies){if(dist(e,p)===1){let dmg=Math.max(1,e.atk-def()+rand(-1,1));hp-=dmg;fx.push({x:p.x,y:p.y,n:dmg,t:18,bad:true});shake=3;if(hp<=0){end('敵に倒された。',true);return}}else if(dist(e,p)<7&&Math.random()<.6){let options=[[1,0],[-1,0],[0,1],[0,-1]].sort((a,b)=>dist({x:e.x+a[0],y:e.y+a[1]},p)-dist({x:e.x+b[0],y:e.y+b[1]},p));let o=options[0],nx=e.x+o[0],ny=e.y+o[1];if(tile(nx,ny)===0&&!(nx===p.x&&ny===p.y)&&!enemies.some(z=>z!==e&&z.x===nx&&z.y===ny)){e.x=nx;e.y=ny}}}reveal();render()}
function attackNearest(){if(phase!=='run')return;let e=enemies.filter(z=>dist(z,p)===1).sort((a,b)=>a.hp-b.hp)[0];if(e)hit(e);else{log('射程内に敵がいない。');advance()}}
function potion(){if(phase!=='run'){log('回復薬は探索中に使える。');return}if(potions<=0){log('回復薬がない。');return}if(hp>=maxhp){log('HPは満タンだ。');return}potions--;let amount=Math.min(20,maxhp-hp);hp+=amount;log('回復薬で HP '+amount+' 回復。');save();advance()}
function equip(id){let i=bag.find(z=>z.id===id);if(!i)return;let old=gear[i.type];gear[i.type]=i;bag=bag.filter(z=>z.id!==id);if(old)bag.push(old);log(i.name+' を装備した。');save();render()}
function unequip(type){if(!gear[type])return;bag.push(gear[type]);gear[type]=null;save();render()}
function sell(id){let i=bag.find(z=>z.id===id);if(!i)return;gold+=i.price;bag=bag.filter(z=>z.id!==id);log(i.name+' を '+i.price+' Gで売却。');save();render()}
function forge(type){let pool=bag.filter(z=>z.type===type).sort((a,b)=>a.power-b.power);if(pool.length<2){log('合成にはバッグ内の同種装備が2つ必要。');return}let cost=30+floor*3;if(gold<cost){log('合成には '+cost+' G必要。');return}gold-=cost;bag=bag.filter(z=>z.id!==pool[0].id&&z.id!==pool[1].id);let i=makeItem(type);i.r=Math.min(3,Math.max(pool[0].r,pool[1].r)+1);i.power=Math.max(pool[0].power,pool[1].power)+rand(2,4);i.name=types[type][i.r];i.price+=40;bag.push(i);toast('FORGE SUCCESS');log(i.name+' +'+i.power+' の合成に成功！');save();render()}
function renderPanel(){let el=$('panel');el.innerHTML='';const add=(node)=>el.appendChild(node),text=(t,cl='muted')=>{let d=document.createElement('div');d.className=cl;d.textContent=t;add(d)},button=(label,fn)=>{let b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);return b};
if(tab==='bag'){text('戦利品 '+bag.length+' 個 · タップで装備');let g=document.createElement('div');g.className='inventory';bag.forEach(i=>{let b=button(icon(i),()=>equip(i.id));b.className='slot '+rarity[i.r];b.title=i.name+' +'+i.power;let s=document.createElement('small');s.textContent='+'+i.power;b.append(s);g.append(b)});add(g);if(!bag.length)text('バッグは空。ダンジョンで装備を拾おう。')}
if(tab==='gear'){for(let type of ['weapon','armor','ring']){let i=gear[type],d=document.createElement('div');d.className='line';let span=document.createElement('span');span.textContent=(type==='weapon'?'⚔ 武器':type==='armor'?'🛡 防具':'💍 指輪')+'  '+(i?i.name+' +'+i.power:'未装備');if(i)span.style.color=rcolors[i.r];d.append(span);if(i)d.append(button('外す',()=>unequip(type)));add(d)}text('死亡時は装備中のアイテムを失う。バッグの中身は保持。')}
if(tab==='forge'){text('同種の装備2個と金貨を使って上位装備に合成。');for(let type of ['weapon','armor','ring']){let d=document.createElement('div');d.className='line';let count=bag.filter(z=>z.type===type).length;let span=document.createElement('span');span.textContent=(type==='weapon'?'⚔ 武器':type==='armor'?'🛡 防具':'💍 指輪')+'  '+count+' / 2';d.append(span,button('合成 30G+',()=>forge(type)));add(d)}}
if(tab==='shop'){text('不要な装備を売却して鍛冶資金を確保。');for(let i of bag){let d=document.createElement('div');d.className='line';let span=document.createElement('span');span.textContent=icon(i)+' '+i.name+' +'+i.power;span.style.color=rcolors[i.r];d.append(span,button(i.price+' G',()=>sell(i.id)));add(d)}let d=document.createElement('div');d.style.marginTop='8px';d.append(button('バッグの全装備を売却',()=>{let total=bag.reduce((s,i)=>s+i.price,0),n=bag.length;gold+=total;bag=[];log(n+'点を売却、'+total+' G獲得。');save();render()}));add(d)} }
function render(){ $('floorLabel').textContent=phase==='run'?'深淵 '+floor+' F':'拠点 / CAMP';$('hpnum').textContent=hp+'/'+maxhp;$('foodnum').textContent=food+'%';$('hpbar').style.width=Math.max(0,hp/maxhp*100)+'%';$('foodbar').style.width=food+'%';$('stats').textContent='ATK '+atk()+' · DEF '+def();$('gold').textContent='✦ '+gold+' G';$('potionBtn').textContent='🧪 回復 ×'+potions;$('equipStrip').textContent='⚔ '+(gear.weapon?gear.weapon.name+' +'+gear.weapon.power:'未装備')+'　🛡 '+(gear.armor?gear.armor.name+' +'+gear.armor.power:'未装備')+'　💍 '+(gear.ring?gear.ring.name+' +'+gear.ring.power:'未装備');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('sel',b.dataset.tab===tab));renderPanel();draw()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawSprite(x,y,kind){let X=x*S,Y=y*S;if(kind==='hero'){rect(X+6,Y+3,8,6,'#d4b78d');rect(X+5,Y+2,10,3,'#697c7d');rect(X+4,Y+9,12,7,'#3c9b8d');rect(X+2,Y+11,3,7,'#d4b78d');rect(X+15,Y+10,3,7,'#c7a781');rect(X+5,Y+16,4,4,'#555a6b');rect(X+11,Y+16,4,4,'#555a6b');rect(X+8,Y+6,2,2,'#222');rect(X+12,Y+6,2,2,'#222');rect(X+16,Y+5,2,10,'#d6d4c6')}else if(kind==='slime'){rect(X+4,Y+9,12,9,'#4aa68e');rect(X+6,Y+6,8,4,'#69d6aa');rect(X+7,Y+12,2,3,'#1d3942');rect(X+12,Y+12,2,3,'#1d3942');rect(X+5,Y+17,11,2,'#24655d')}else if(kind==='wisp'){rect(X+7,Y+3,6,13,'#8b72db');rect(X+4,Y+8,12,6,'#c7a6ff');rect(X+8,Y+7,4,5,'#fff0ce');rect(X+6,Y+17,2,2,'#8366c7')}else if(kind==='brute'){rect(X+3,Y+5,14,13,'#a95455');rect(X+5,Y+2,4,5,'#7c363c');rect(X+12,Y+2,4,5,'#7c363c');rect(X+6,Y+9,3,3,'#ffdc9c');rect(X+12,Y+9,3,3,'#ffdc9c');rect(X+4,Y+17,5,3,'#59343a');rect(X+11,Y+17,5,3,'#59343a')}}
function draw(){ctx.fillStyle='#090c13';ctx.fillRect(0,0,480,480);if(phase!=='run'){for(let y=0;y<V;y++)for(let x=0;x<V;x++){let n=(x*13+y*19)%7;rect(x*S,y*S,S,S,n<2?'#171b27':'#131722');if((x*5+y*7)%19===0)rect(x*S+4,y*S+5,3,3,'#292b37')}ctx.fillStyle='#b9a06d';ctx.textAlign='center';ctx.font='bold 15px Georgia';ctx.fillText('THE FORGOTTEN ABYSS',240,250);ctx.textAlign='left';return}
let ox=Math.max(0,Math.min(N-V,p.x-Math.floor(V/2))),oy=Math.max(0,Math.min(N-V,p.y-Math.floor(V/2)));ctx.save();if(shake){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake=Math.max(0,shake-1)}
for(let sy=0;sy<V;sy++)for(let sx=0;sx<V;sx++){let x=sx+ox,y=sy+oy;if(!seen[y]?.[x]&&!showFullMap){rect(sx*S,sy*S,S,S,'#080a11');continue}let wall=tile(x,y)===1,noise=(x*17+y*31)%9;rect(sx*S,sy*S,S,S,wall?(noise<3?'#333746':'#2a2f3c'):(noise<3?'#242631':'#20232c'));if(wall){rect(sx*S+1,sy*S+1,18,2,'#444755');rect(sx*S+1,sy*S+10,18,2,'#1d202b');rect(sx*S+((x+y)%2?7:2),sy*S+3,2,7,'#242734')}else{if(noise===0)rect(sx*S+5,sy*S+13,3,2,'#34343b');if(noise===5)rect(sx*S+14,sy*S+4,2,2,'#3b373a')}
let distance=Math.hypot(x-p.x,y-p.y);if(distance>3.2&&!showFullMap)rect(sx*S,sy*S,S,S,'#10131c99')}
function vis(z){return (seen[z.y]?.[z.x]||showFullMap)&&z.x>=ox&&z.x<ox+V&&z.y>=oy&&z.y<oy+V}
if(vis(stairs)){let x=(stairs.x-ox)*S,y=(stairs.y-oy)*S;rect(x+2,y+2,16,16,'#9e773f');rect(x+5,y+5,10,10,'#30251f');rect(x+7,y+7,6,6,'#e6b95c')}
loot.forEach(z=>{if(!vis(z))return;let x=(z.x-ox)*S,y=(z.y-oy)*S;if(z.kind==='coin'){rect(x+6,y+7,9,9,'#f0c65d');rect(x+8,y+5,5,3,'#ffe7a0')}else if(z.kind==='potion'){rect(x+7,y+5,6,11,'#cb525e');rect(x+8,y+3,4,3,'#dfd3b8')}else{rect(x+5,y+7,11,9,'#855eb1');rect(x+7,y+4,7,4,'#d7a6ff')}});
enemies.forEach(e=>{if(vis(e))drawSprite(e.x-ox,e.y-oy,e.kind)});drawSprite(p.x-ox,p.y-oy,'hero');
fx=fx.filter(f=>f.t-->0);fx.forEach(f=>{let x=(f.x-ox)*S,y=(f.y-oy)*S;ctx.fillStyle=f.bad?'#ff7a7a':'#ffdc81';ctx.font='bold 13px sans-serif';ctx.fillText('-'+f.n,x,y-12+f.t/2)});ctx.restore();
let gradient=ctx.createRadialGradient((p.x-ox)*S+10,(p.y-oy)*S+10,55,(p.x-ox)*S+10,(p.y-oy)*S+10,290);gradient.addColorStop(0,'#00000000');gradient.addColorStop(1,'#05060dcc');ctx.fillStyle=gradient;ctx.fillRect(0,0,480,480)}
load();if(!bag.length&&!gear.weapon){bag.push(makeItem('weapon',1));bag.push(makeItem('armor',1));bag[0].name='見習いの剣';bag[1].name='旅人の外套'}
$('mainButton').addEventListener('click',start);$('closeButton').addEventListener('click',()=>{$('overlay').style.display='none';render()});$('returnBtn').addEventListener('click',()=>{if(phase==='run')end('無事に拠点へ帰還した。');else{ $('overlay').style.display='flex';$('modalTitle').textContent='DUNGEON FORGE';$('modalTag').textContent='READY TO EXPLORE';$('modalDesc').textContent='装備を整えたら深淵へ潜ろう。';$('mainButton').textContent='⚔ ダンジョンへ潜る';$('closeButton').style.display='block'}});$('potionBtn').addEventListener('click',potion);$('attackBtn').addEventListener('click',attackNearest);$('waitBtn').addEventListener('click',()=>{if(phase==='run')advance()});$('mapBtn').addEventListener('click',()=>{showFullMap=!showFullMap;log(showFullMap?'地図を表示。未探索エリアも確認できる。':'通常の視界に戻した。');draw()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{let [x,y]=b.dataset.dir.split(',').map(Number);move(x,y)}));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.body.classList.add('panel-open');render()}));$('panelClose').addEventListener('click',()=>document.body.classList.remove('panel-open'));let repeatTimer=null,repeatDelay=null;document.querySelectorAll('[data-dir]').forEach(b=>{const stop=()=>{clearTimeout(repeatDelay);clearInterval(repeatTimer);repeatDelay=null;repeatTimer=null};b.addEventListener('pointerdown',()=>{stop();repeatDelay=setTimeout(()=>{let [x,y]=b.dataset.dir.split(',').map(Number);repeatTimer=setInterval(()=>{if(phase==='run')move(x,y)},190)},360)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,stop))});document.addEventListener('keydown',e=>{let dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(dirs[e.key]){e.preventDefault();move(...dirs[e.key])}else if(e.key===' '){e.preventDefault();attackNearest()}});render();
})();
</script></body></html>
